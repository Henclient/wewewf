name: Build HenClient Reborn

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Check repository layout
        run: |
          for f in build.gradle settings.gradle gradle.properties src/main/resources/fabric.mod.json src/main/java/com/henclient/reborn/HenClientReborn.java; do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "MISSING $f"; MISSING=1; fi
          done
          echo "Java files found: $(find src -name '*.java' 2>/dev/null | wc -l) (expected 34)"
          if [ -n "$MISSING" ]; then echo "Some project files are missing from the repository."; exit 1; fi

      - name: Build mod
        run: gradle build --stacktrace

      - name: Verify JAR contents
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "Built: $JAR"
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q "fabric.mod.json" || { echo "fabric.mod.json is missing from the JAR"; exit 1; }
          unzip -l "$JAR" | grep -q "HenClientReborn.class" || { echo "Mod classes are missing from the JAR"; exit 1; }

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: HenClient-Reborn
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
