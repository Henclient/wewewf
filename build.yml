name: Build HenClient Reborn

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Build mod
        run: ./gradlew build --stacktrace

      - name: Verify JAR contents
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "Built: $JAR"
          unzip -l "$JAR" | grep -E "fabric.mod.json|HenClientReborn.class"
          unzip -p "$JAR" fabric.mod.json | head -n 12

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: HenClient-Reborn
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
